
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-otm"
version = "0.1.0"
description = "Pac-Man environment for combinatorial optimization research"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.5",
    "pygame-ce>=2.5.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pacman_otm = "pacman_otm.cli:main"