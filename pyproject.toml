
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-otm"
version = "0.1.0"
description = "Pac-Man environment for combinatorial optimization research"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.5",
    "pygame-ce>=2.5.8"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pacman_otm.mazes" = ["layouts/*.txt", "recipes/*.toml", "saved/*.json"]

[project.scripts]
pacman_otm = "pacman_otm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Long sweeps: run them with `python -m pytest -m slow`.
markers = ["slow: long seed sweeps, skipped by default"]
addopts = "-m \"not slow\""
