name = "open-lattice"
description = "Generic loopy maze with no dead ends."

[size]
height = 31
width = 31

[shape]
kind = "rectangle"

[topography]
generator = "lattice"
spacing = [2, 4]
corridor_width = 1
extra_loops = 0.15
mirror = "none"          # none | horizontal | vertical | both

[[rules]]
rule = "max_dead_ends"
count = 0

[[rules]]
rule = "max_block"
tile = "corridor"
size = 2

[[rules]]
rule = "max_block"
tile = "wall"
size = 5

[[rules]]
rule = "no_diagonal_contact"

[content.pellets]
placer = "clear_center"    # size = 0: automatic, a third of the shorter side

[content.start]
placer = "center"

[content.ghosts]
placer = "random"
count = 4                # ghost spawns (Blinky, Pinky, Inky, Clyde); --ghosts N overrides
min_distance = 10        # BFS steps from the start
